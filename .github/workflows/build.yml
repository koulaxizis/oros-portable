name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on this commit, e.g. v0.1.0 (empty: test build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd launcher && go vet ./... && go test ./...
      - run: cd tools/sticktest && go vet ./... && go test ./...
      - name: Stick script test (loop devices)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ntfs-3g
          sudo scripts/test-make-sticks.sh

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="0.0.0-${GITHUB_SHA::7}";; esac
          if [ -n "$TAG" ]; then VERSION="${TAG#v}"; fi
          scripts/build.sh "$VERSION"
          scripts/build-sticktest.sh "$VERSION"
      - name: Sources
        # Tags only (several GB of downloads); a manual run tests the step.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orOS-Portable
          path: |
            out/*.zip
            out/SOURCES.txt
            out/sticktest/*
            out/src/SHA256SUMS-src.txt
          retention-days: 14
      - name: Release
        # A tag push, or a manual run with a tag (the tag is then created
        # on the commit that was built).
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "bad tag: $TAG"; exit 1;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" out/*.zip out/SOURCES.txt out/sticktest/* out/src/* --title "orOS Portable $TAG" --notes-file dist-extra/RELEASE-NOTES.md
